name: MediKristal CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medikristal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + PostgreSQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: medikristal
          POSTGRES_USER: medikristal
          POSTGRES_PASSWORD: medikristal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medikristal -d medikristal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.lock
          python -m pip install --disable-pip-version-check pytest

      - name: Compile Python sources
        run: python -m compileall -q backend tests scripts tools

      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Run application tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python -m pytest -q

      - name: Validate reference contracts (advisory)
        continue-on-error: true
        run: python tools/validate_reference.py

      - name: Exercise Alembic on PostgreSQL
        working-directory: backend
        env:
          MEDIKRISTAL_DATABASE_URL: postgresql+psycopg://medikristal:medikristal@127.0.0.1:5432/medikristal
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
