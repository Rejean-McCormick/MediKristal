services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_DB: medikristal
      POSTGRES_USER: medikristal
      POSTGRES_PASSWORD: ${MEDIKRISTAL_DB_PASSWORD:?set MEDIKRISTAL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikristal -d medikristal"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - medikristal_pg:/var/lib/postgresql/data
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: ["alembic","upgrade","head"]
    environment:
      MEDIKRISTAL_DATABASE_URL: postgresql+psycopg://medikristal:${MEDIKRISTAL_DB_PASSWORD:?set MEDIKRISTAL_DB_PASSWORD}@db:5432/medikristal
      MEDIKRISTAL_AUTH_SECRET: ${MEDIKRISTAL_AUTH_SECRET:?set MEDIKRISTAL_AUTH_SECRET}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      MEDIKRISTAL_DATABASE_URL: postgresql+psycopg://medikristal:${MEDIKRISTAL_DB_PASSWORD:?set MEDIKRISTAL_DB_PASSWORD}@db:5432/medikristal
      MEDIKRISTAL_AUTH_SECRET: ${MEDIKRISTAL_AUTH_SECRET:?set MEDIKRISTAL_AUTH_SECRET}
      MEDIKRISTAL_ENV: production
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python","-m","medikristal.worker"]
    environment:
      MEDIKRISTAL_DATABASE_URL: postgresql+psycopg://medikristal:${MEDIKRISTAL_DB_PASSWORD:?set MEDIKRISTAL_DB_PASSWORD}@db:5432/medikristal
      MEDIKRISTAL_AUTH_SECRET: ${MEDIKRISTAL_AUTH_SECRET:?set MEDIKRISTAL_AUTH_SECRET}
      MEDIKRISTAL_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  medikristal_pg: {}
